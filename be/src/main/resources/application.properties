# ===================================================================
# APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=qlyphongtro-api
server.port=8080

# ===================================================================
# IMPORT SECRETS (BẢO MẬT)
# ===================================================================
# LƯU Ý: Nạp file secrets để không lộ thông tin khi up lên Github
# Đảm bảo bạn đã thêm `application-secrets.properties` vào file .gitignore
spring.config.import=optional:classpath:application-secrets.properties

# ===================================================================
# 1. DATABASE (SUPABASE POSTGRESQL)
# ===================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Giới hạn connection pool để tránh lỗi "max clients reached" trên Supabase free tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Cho phép PostgreSQL tự cast string → custom ENUM type (trang_thai_hoa_don, trang_thai_hop_dong, ...)
spring.datasource.hikari.data-source-properties.stringtype=unspecified
# (URL, Username, Password nằm trong application-secrets.properties)

# ===================================================================
# 2. MAIL SERVER (SMTP)
# ===================================================================
spring.mail.host=mail92134.maychuemail.com
spring.mail.port=465
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=true
# (Username, Password nằm trong application-secrets.properties)

# ===================================================================
# 3. OAUTH2
# ===================================================================
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
# (Client ID, Client Secret nằm trong application-secrets.properties)

# ===================================================================
# 4. VNPAY SANDBOX
# ===================================================================
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payment/vnpay-return
# (TMN Code, Hash Secret nằm trong application-secrets.properties)

# ===================================================================
# 5. FRONTEND URL (EMAIL VERIFICATION LINK)
# ===================================================================
app.frontend.base-url=http://localhost:3000
