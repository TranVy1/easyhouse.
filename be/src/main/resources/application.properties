# ===================================================================
# APPLICATION CONFIGURATION
# ===================================================================
spring.application.name=qlyphongtro-api
server.port=8080

# ===================================================================
# IMPORT SECRETS (BẢO MẬT)
# ===================================================================
# LƯU Ý: Nạp file secrets để không lộ thông tin khi up lên Github
# Đảm bảo bạn đã thêm `application-secrets.properties` vào file .gitignore
spring.config.import=optional:classpath:application-secrets.properties

# ===================================================================
# 1. DATABASE (SUPABASE POSTGRESQL)
# ===================================================================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Giới hạn connection pool để tránh lỗi "max clients reached" trên Supabase free tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Cho phép PostgreSQL tự cast string → custom ENUM type (trang_thai_hoa_don, trang_thai_hop_dong, ...)
spring.datasource.hikari.data-source-properties.stringtype=unspecified
# (URL, Username, Password nằm trong application-secrets.properties)

# ===================================================================
# 2. MAIL SERVER (SMTP)
# ===================================================================
spring.mail.host=mail92134.maychuemail.com
spring.mail.port=465
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=true
# (Username, Password nằm trong application-secrets.properties)

# ===================================================================
# 3. OAUTH2
# ===================================================================
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
# (Client ID, Client Secret nằm trong application-secrets.properties)

# ===================================================================
# 4. VNPAY SANDBOX
# ===================================================================
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payment/vnpay-return
# (TMN Code, Hash Secret nằm trong application-secrets.properties)

# ===================================================================
# 5. FRONTEND URL (EMAIL VERIFICATION LINK)
# ===================================================================
app.frontend.base-url=http://localhost:3000

# ===================================================================
# Giới hạn connection pool để tránh lỗi "max clients reached" trên Supabase free tier
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
# Cho phép PostgreSQL tự cast string → custom ENUM type (trang_thai_hoa_don, trang_thai_hop_dong, ...)
spring.datasource.hikari.data-source-properties.stringtype=unspecified
# (URL, Username, Password nằm trong application-secrets.properties)

# ===================================================================
# 2. MAIL SERVER (SMTP)
# ===================================================================
spring.mail.host=mail92134.maychuemail.com
spring.mail.port=465
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=true
# (Username, Password nằm trong application-secrets.properties)

# ===================================================================
# 3. OAUTH2
# ===================================================================
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.facebook.scope=public_profile,email
# (Client ID, Client Secret nằm trong application-secrets.properties)

# ===================================================================
# 4. VNPAY SANDBOX
# ===================================================================
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/payment/vnpay-return
# (TMN Code, Hash Secret nằm trong application-secrets.properties)

# ===================================================================
# 5. FRONTEND URL (EMAIL VERIFICATION LINK)
# ===================================================================
app.frontend.base-url=http://localhost:3000

# ===================================================================
# 6. JWT CONFIGURATION
# ===================================================================
# FIX #4: jwt.secret PHẢI được set trong application-secrets.properties (file này trong .gitignore)
# KHÔNG đặt giá trị mặc định ở đây — app sẽ fail-fast nếu thiếu config để bảo đảm an toàn
# Để tạo secret mạnh (>= 32 chars): openssl rand -base64 48
# jwt.secret=<SET_TRONG_APPLICATION-SECRETS.PROPERTIES>
jwt.access-ttl-minutes=60
jwt.refresh-ttl-days=30

# ===================================================================
# 7. CORS CONFIGURATION
# ===================================================================
# FIX #3: Externalize CORS origins — thay đổi domain khi deploy production
# Format: phân cách bằng dấu phẩy, không có dấu cách
# Development:
cors.allowed-origins=http://localhost:3000,http://localhost:8080
# Production: override trong application-secrets.properties
# cors.allowed-origins=https://easyhouse.vn,https://www.easyhouse.vn

# ===================================================================
# 7. REDIS CONFIGURATION
# ===================================================================
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

# ===================================================================
# 8. ACTUATOR & PROMETHEUS CONFIGURATION
# ===================================================================
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
