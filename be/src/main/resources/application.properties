
spring.application.name=qlyphongtro-api
server.port=8080

spring.config.import=optional:classpath:application-secrets.properties

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
# Pool cu la 5 (di san thoi dung Supabase free tier, gioi han so ket noi rat chat).
# Docker hien dung Postgres local nen gioi han do khong con ap dung. Nang len 15 de
# module chat khong tranh ket noi voi nghiep vu hoa don/hop dong.
# Luu y: pool to hon KHONG phai luon tot hon — so truy van chay song song thuc su bi
# gioi han boi so core CPU va toc do dia. 15 la muc thoang nhung van hieu qua.
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.data-source-properties.stringtype=unspecified

spring.mail.host=mail92134.maychuemail.com
spring.mail.port=465
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.facebook.scope=public_profile,email

vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=http://localhost:8080/api/vnpay/vnpay-return

app.frontend.base-url=http://localhost:3000

jwt.access-ttl-minutes=600
jwt.refresh-ttl-days=30

cors.allowed-origins=http://localhost:3000,http://localhost:8080

# Web Push (P5). De trong = tat thong bao day: WebPushSender khong duoc tao bean
# va he thong bo qua viec gui push, ung dung van chay binh thuong.
# Sinh khoa: npx web-push generate-vapid-keys
push.vapid.public-key=${PUSH_VAPID_PUBLIC_KEY:}
push.vapid.private-key=${PUSH_VAPID_PRIVATE_KEY:}
push.vapid.subject=${PUSH_VAPID_SUBJECT:mailto:admin@easyhouse.vn}

spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
