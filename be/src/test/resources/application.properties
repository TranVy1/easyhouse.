spring.application.name=qlyphongtro-api-test
server.port=0

# Vai entity dung columnDefinition la kieu rieng cua PostgreSQL (inet, enum). H2
# khong biet nhung kieu do nen sinh DDL cho test se that bai va MOI test nap
# Spring context deu hong. Cach xu ly: khai bao DOMAIN tuong duong trong H2.
# 'inet' da duoc xu ly san theo cach nay; them 'trang_thai_phuong_tien' cua
# entity PhuongTien theo dung khuon do.
# Luu y: chi anh huong test — production dung ddl-auto=none nen khong sinh DDL.
# Trong INIT, H2 ngan cach nhieu lenh bang '\;' (dau ';' tran la ngan cach tham so URL).
# File .properties lai coi '\' la ky tu escape, nen phai viet '\\;' moi ra dung '\;'.
spring.datasource.url=jdbc:h2:mem:easyhouse_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS inet AS varchar(45)\\;CREATE DOMAIN IF NOT EXISTS trang_thai_phuong_tien AS varchar(50)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false

spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=noreply@easyhouse.local
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.properties.mail.smtp.starttls.enable=false

cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret

app.frontend.base-url=http://localhost:3000
vnpay.return-url=http://localhost:3000/thanh-toan/vnpay-return
# VNPayService yeu cau du 4 property; thieu 3 cai duoi khien MOI test nap Spring
# context that bai o buoc tao bean VNPayController. Gia tri gia, chi dung cho test.
vnpay.tmn-code=TEST_TMN_CODE
vnpay.hash-secret=test-hash-secret-khong-dung-that
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
jwt.secret=EasyHouse-Test-Secret-Key-Must-Be-At-Least-256-Bits-Long!!
jwt.access-ttl-minutes=60
jwt.refresh-ttl-days=30
