groups:
  - name: SystemAlerts
    rules:
      - alert: HighCPUUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU Usage (instance {{ $labels.instance }})"
          description: "CPU usage is above 80% for more than 2 minutes.\n  VALUE = {{ $value }}\n  LABELS = {{ $labels }}"

  - name: APIAlerts
    rules:
      - alert: HighAPILatency
        expr: (sum(rate(http_server_requests_seconds_sum[1m])) / sum(rate(http_server_requests_seconds_count[1m]))) > 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High API Latency"
          description: "Average API latency is above 2 seconds for more than 1 minute.\n  VALUE = {{ $value }}s"
