# Production override. Start with:
# docker compose -f docker-compose.easyhouse.yml -f docker-compose.production.yml up -d --build
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        BACKEND_URL: http://backend:8080
        NEXT_PUBLIC_WS_URL: ${WS_URL:-ws://localhost/ws}
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8080
      NEXTAUTH_URL: ${FRONTEND_URL:-http://localhost}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-easyhouse-docker-dev-secret-change-me}
      NEXT_PUBLIC_WS_URL: ${WS_URL:-ws://localhost/ws}
      REDIS_URL: redis://redis:6379
    command: !reset []
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: easyhouse-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/easyhouse.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - easyhouse_network
    restart: unless-stopped
