# Production override. Start with:
# docker compose -f docker-compose.easyhouse.yml -f docker-compose.production.yml up -d --build
services:
  backend:
    environment:
      APP_FRONTEND_BASE_URL: https://easyhouse.site
      VNPAY_RETURN_URL: https://easyhouse.site/api/vnpay/vnpay-return

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        BACKEND_URL: http://backend:8080
        # NEXT_PUBLIC_* is embedded at build time.  The browser reaches STOMP
        # through Nginx over the same public HTTPS origin.
        NEXT_PUBLIC_WS_URL: wss://easyhouse.site/ws
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:8080
      NEXTAUTH_URL: https://easyhouse.site
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-easyhouse-docker-dev-secret-change-me}
      NEXT_PUBLIC_WS_URL: wss://easyhouse.site/ws
      REDIS_URL: redis://redis:6379
    command: !reset []
    volumes: !reset []
    ports: !reset []
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: easyhouse-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/easyhouse.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - easyhouse_network
    restart: unless-stopped
