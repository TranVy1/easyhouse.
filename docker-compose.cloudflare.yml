services:
  backend:
    env_file:
      - ./deploy/cloudflare.env
    environment:
      APP_FRONTEND_BASE_URL: https://easyhouse.site
      CORS_ALLOWED_ORIGINS: https://easyhouse.site,https://www.easyhouse.site
      # VNPAY must return to the backend endpoint; it then redirects users to
      # the HTTPS frontend result page.
      VNPAY_RETURN_URL: https://easyhouse.site/api/vnpay/vnpay-return

  frontend:
    env_file:
      - ./deploy/cloudflare.env
    environment:
      BACKEND_URL: http://backend:8080
      NEXTAUTH_URL: https://easyhouse.site
      NEXTAUTH_SECRET: ltHr/DftdYoadNP5U+HHmUsdbuRCUyEx1hhpVOgXk1CF6JVrNWzlo9ei1ONP8LaK

  cloudflared:
    image: cloudflare/cloudflared:latest
    env_file:
      - ./deploy/cloudflare.env
    command: tunnel --no-autoupdate run
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - easyhouse_network
