services:
  backend:
    env_file:
      - ./deploy/cloudflare.env
    environment:
      APP_FRONTEND_BASE_URL: https://easyhouse.site
      CORS_ALLOWED_ORIGINS: https://easyhouse.site,https://www.easyhouse.site
      # VNPAY must return to the backend endpoint; it then redirects users to
      # the HTTPS frontend result page.
      VNPAY_RETURN_URL: https://easyhouse.site/api/vnpay/vnpay-return

  frontend:
    env_file:
      - ./deploy/cloudflare.env
    environment:
      BACKEND_URL: http://backend:8080
      NEXTAUTH_URL: https://easyhouse.site
      NEXTAUTH_SECRET: ltHr/DftdYoadNP5U+HHmUsdbuRCUyEx1hhpVOgXk1CF6JVrNWzlo9ei1ONP8LaK

  nginx:
    image: nginx:1.27-alpine
    container_name: easyhouse-nginx-local
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - easyhouse_network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    env_file:
      - ./deploy/cloudflare.env
    command: tunnel --no-autoupdate run --token eyJhIjoiYjIxMmEyODU5ZTJiODY5YzVlZThjMWIyODI4M2Y2ZTUiLCJ0IjoiMDY5NTMxZDEtN2IwZi00ZmNiLTgyOTctY2MxMDE1Njc1YjE0IiwicyI6Ik1ERmhOalJoTmpNdE1qQTBOUzAwT0dKbExXRTVaREF0WkRGaVl6UXdNekUzWkdRNCJ9
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - easyhouse_network
networks:
  easyhouse_network:
    driver: bridge
