services:
  postgres:
    image: postgres:16-alpine
    container_name: easyhouse-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    volumes:
      - easyhouse_postgres_data:/var/lib/postgresql/data
      - ./sql/init-db.sql:/docker-entrypoint-initdb.d/00-easyhouse-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - easyhouse_network

  redis:
    image: redis:7-alpine
    container_name: easyhouse-redis
    ports:
      - "6380:6379"
    volumes:
      - easyhouse_redis_data:/data
    networks:
      - easyhouse_network

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile.dev
    container_name: easyhouse-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_STRINGTYPE: unspecified
      JWT_SECRET: easyhouse-docker-dev-jwt-secret-change-me-please-1234567890
      APP_FRONTEND_BASE_URL: http://localhost:3002
      CORS_ALLOWED_ORIGINS: http://localhost:3002,http://localhost:8082,http://localhost:3000,http://localhost:8080
      VNPAY_TMN_CODE: EASYHOUSE
      VNPAY_HASH_SECRET: easyhouse-docker-dev-vnpay-hash-secret-change-me
      VNPAY_RETURN_URL: http://localhost:3002/khach-thue/dashboard/hoa-don
      CLOUDINARY_CLOUD_NAME: your-cloud-name
      CLOUDINARY_API_KEY: your-api-key
      CLOUDINARY_API_SECRET: your-api-secret
      SPRING_DATA_REDIS_HOST: host.docker.internal
      SPRING_DATA_REDIS_PORT: 6380
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "8082:8080"
    volumes:
      - ./be:/app
      - easyhouse_maven_cache:/root/.m2
    command: mvn spring-boot:run
    networks:
      - easyhouse_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: easyhouse-frontend
    depends_on:
      - backend
      - redis
    environment:
      BACKEND_URL: http://backend:8080
      NEXTAUTH_URL: http://localhost:3002
      NEXTAUTH_SECRET: easyhouse-docker-dev-secret-change-me
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3000"
    volumes:
      - ./frontend:/app
      - easyhouse_node_modules:/app/node_modules
      - easyhouse_next_cache:/app/.next
    command: npm run dev -- --hostname 0.0.0.0
    networks:
      - easyhouse_network

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    restart: unless-stopped
    networks:
      - easyhouse_network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - easyhouse_network

  node_exporter:
    image: quay.io/prometheus/node-exporter:latest
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
    pid: host
    restart: unless-stopped
    volumes:
      - '/:/host:ro'
    ports:
      - "9100:9100"
    networks:
      - easyhouse_network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - easyhouse_network

networks:
  easyhouse_network:
    driver: bridge

volumes:
  easyhouse_postgres_data:
  easyhouse_redis_data:
  easyhouse_maven_cache:
  easyhouse_node_modules:
  easyhouse_next_cache:
  prometheus_data:
  grafana_data:
