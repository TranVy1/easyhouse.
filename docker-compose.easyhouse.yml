services:
  postgres:
    # Giu 16 (gia tri ban dau, truoc commit dff3005 ha xuong 14).
    # Ha xuong 14 gay hai van de: volume cu do PostgreSQL 16 tao se khong mo duoc
    # ("database files are incompatible with server"), va sql/init-db.sql duoc
    # pg_dump tu ban 17.6 nen phuc hoi vao 14 de vap cu phap moi.
    image: postgres:14-alpine
    container_name: easyhouse-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54322:5432"
    volumes:
      - easyhouse_postgres_data:/var/lib/postgresql/data
      # Must be a real, complete schema-and-data dump.  The former
      # sql/init-db.sql path had become an empty directory, so a new volume
      # could start without any EasyHouse data.
      - ./sql/easyhouse-after-fix.sql:/docker-entrypoint-initdb.d/00-easyhouse-db.sql:ro
      # The complete dump currently predates the chat module. Keep these
      # idempotent migrations mounted so a fresh volume matches the application.
      - ./sql/migrations/20260722_add_chat_module.sql:/docker-entrypoint-initdb.d/01-chat-module.sql:ro
      - ./sql/migrations/20260722_add_chat_info_panel.sql:/docker-entrypoint-initdb.d/02-chat-info-panel.sql:ro
      - ./sql/migrations/20260722_add_mute_until.sql:/docker-entrypoint-initdb.d/03-chat-mute-until.sql:ro
      - ./sql/migrations/20260722_add_chat_p8.sql:/docker-entrypoint-initdb.d/04-chat-p8.sql:ro
      - ./sql/migrations/20260722_add_chat_moderation.sql:/docker-entrypoint-initdb.d/05-chat-moderation.sql:ro
      - ./sql/migrations/20260722_add_chat_search.sql:/docker-entrypoint-initdb.d/06-chat-search.sql:ro
      - ./sql/migrations/20260804_share_support_with_admins.sql:/docker-entrypoint-initdb.d/07-share-support-admins.sql:ro
      - ./sql/migrations/20260801_expand_refresh_token.sql:/docker-entrypoint-initdb.d/08-expand-refresh-token.sql:ro
      - ./sql/migrations/20260813_checkout_deposit_settlement.sql:/docker-entrypoint-initdb.d/09-checkout-settlement.sql:ro
      - ./sql/migrations/20260814_invoice_traceability_and_issuance.sql:/docker-entrypoint-initdb.d/10-invoice-traceability.sql:ro
      - ./sql/migrations/20260814_deposit_ledger.sql:/docker-entrypoint-initdb.d/11-deposit-ledger.sql:ro
      - ./sql/migrations/20260814_asset_handover.sql:/docker-entrypoint-initdb.d/12-asset-handover.sql:ro
      - ./sql/migrations/20260814_vehicle_fee_plan.sql:/docker-entrypoint-initdb.d/13-vehicle-fee-plan.sql:ro
      - ./sql/migrations/20260814_notification_delivery_dedupe.sql:/docker-entrypoint-initdb.d/14-notification-delivery-dedupe.sql:ro
      - ./sql/migrations/20260814_notification_delivery.sql:/docker-entrypoint-initdb.d/15-notification-delivery.sql:ro
      - ./sql/migrations/20260814_vehicle_assignment_history.sql:/docker-entrypoint-initdb.d/16-vehicle-assignment-history.sql:ro
      - ./sql/migrations/20260814_invoice_reconciliation_and_due_today.sql:/docker-entrypoint-initdb.d/17-invoice-reconciliation-and-due-today.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - easyhouse_network

  redis:
    image: redis:7-alpine
    container_name: easyhouse-redis
    ports:
      - "6380:6379"
    volumes:
      - easyhouse_redis_data:/data
    networks:
      - easyhouse_network

  backend:
    build:
      context: ./be
      dockerfile: Dockerfile.dev
    container_name: easyhouse-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_DATASOURCE_HIKARI_DATA_SOURCE_PROPERTIES_STRINGTYPE: unspecified
      JWT_SECRET: easyhouse-docker-dev-jwt-secret-change-me-please-1234567890
      APP_FRONTEND_BASE_URL: ${FRONTEND_URL:-http://localhost:3002}
      # Frontend goes through Nginx at easyhouse.site in the production override.
      # The WebSocket handshake carries that Origin, so it must be permitted here
      # as well as the direct-development origins.
      CORS_ALLOWED_ORIGINS: http://localhost:3002,http://localhost:8082,http://localhost:3000,http://localhost:8080,http://172.237.88.238:3002,http://172.237.88.238:8082,http://172.237.88.238:3000,http://172.237.88.238:8080,http://easyhouse.site,http://www.easyhouse.site,https://easyhouse.site,https://www.easyhouse.site
      # Credentials are loaded from be/src/main/resources/application-secrets.properties.
      # Do not override them with placeholder values here: VNPAY rejects an unknown
      # vnp_TmnCode as "The terminal (website) not found".
      # The browser is redirected here after payment; the controller verifies the
      # signature, updates the invoice, then redirects to the frontend result page.
      VNPAY_RETURN_URL: ${FRONTEND_URL:-http://localhost:3002}/api/vnpay/vnpay-return
      # Cloudinary credentials are loaded from application-secrets.properties.
      # Do not set placeholder CLOUDINARY_* variables here: environment variables
      # take precedence in Spring and would disable uploads in Cloudinary.
      # Khoa VAPID cho Web Push. Sinh bang: npx web-push generate-vapid-keys
      # Day la khoa DEV, production phai sinh cap khac va dat qua bien moi truong.
      # Thieu hai bien nay thi WebPushSender khong duoc tao bean va he thong bo qua
      # viec gui push — ung dung van chay binh thuong.
      PUSH_VAPID_PUBLIC_KEY: BMO7X0njraca6-q756yDbbLddU1rTwcbKycznqk6l9noj02B--_Z96GUqCstDJMLP48YEkP1lPY6fXhsEGsdv2Q
      PUSH_VAPID_PRIVATE_KEY: zXTZzsbV4rKdnllXEoFyg7nR3QHnLbaxhZakAHF6h1w
      PUSH_VAPID_SUBJECT: mailto:admin@easyhouse.local
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    ports:
      - "8082:8080"
    volumes:
      - ./be:/app
      - easyhouse_maven_cache:/root/.m2
    command: mvn spring-boot:run
    networks:
      - easyhouse_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: easyhouse-frontend
    depends_on:
      - backend
      - redis
    environment:
      BACKEND_URL: http://backend:8080
      NEXTAUTH_URL: ${FRONTEND_URL:-http://localhost:3002}
      NEXTAUTH_SECRET: easyhouse-docker-dev-secret-change-me
      # Chat realtime: WebSocket noi THANG tu trinh duyet toi backend, khong qua
      # rewrite cua Next (rewrite khong nang cap duoc ket noi WebSocket).
      # Dung cong da publish ra host (8082), khong phai backend:8080 trong mang docker.
      NEXT_PUBLIC_WS_URL: ${WS_URL:-ws://localhost:8082/ws}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3000"
    volumes:
      - ./frontend:/app
      - easyhouse_node_modules:/app/node_modules
      - easyhouse_next_cache:/app/.next
    # /app/node_modules is a named volume. Install from the lockfile at startup
    # so a fresh or previously cached volume cannot omit newly added packages.
    command: sh -c "npm ci --legacy-peer-deps && rm -rf .next/* .next/.[!.]* .next/..?* && npm run dev -- --hostname 0.0.0.0"
    networks:
      - easyhouse_network

networks:
  easyhouse_network:
    driver: bridge

volumes:
  easyhouse_postgres_data:
  easyhouse_redis_data:
  easyhouse_maven_cache:
  easyhouse_node_modules:
  easyhouse_next_cache:
